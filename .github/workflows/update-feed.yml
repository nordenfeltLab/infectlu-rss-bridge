name: Update Infect@LU RSS bridge

on:
  schedule:
    # Mondays at 05:00 UTC, before the Monday 08:00 Europe/Stockholm check
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download Infect@LU RSS and create HTML, JSON and tracking state
        env:
          PREVIOUS_FEED_URL: https://nordenfeltlab.github.io/infectlu-rss-bridge/feed.json
        run: python scripts/fetch_rss.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload public HTML and JSON
        uses: actions/upload-pages-artifact@v4
        with:
          path: './docs'
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Save tracking state for the next run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .state/seen_publications.json
          if ! git diff --cached --quiet; then
            git commit -m "Track seen Infect@LU publications"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
